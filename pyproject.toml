[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srgplus-mcp"
version = "0.4.2"
description = "MCP server for SRG+ — manage hubs, channels, content, assets, users, and workspaces from any MCP-aware agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "SRG", email = "support@srg.plus"},
]
keywords = ["srg", "mcp", "ai", "claude", "media", "content"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0",
    # Upper-bound mcp until we confirm 2.x is compatible — we depend on the
    # private `mcp._mcp_server` attribute in serve/main.py, which any major
    # version bump could break without warning.
    "mcp[cli]>=1.0,<2.0",
    "srgplus>=0.2.0",
]

[project.optional-dependencies]
server = [
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    # OAuth 2.1 layer (SRGDEV-26):
    # - pyjwt: HS256 sign/verify for client_id, codes, access/refresh tokens
    # - cryptography: AES-256-GCM for the wrapped api_key inside JWTs
    # - cachetools: TTL+LRU caches for CSRF tokens, code one-time-use deny
    #   list, and access/refresh token revocation deny-list
    # - jinja2: render the branded /oauth/authorize consent page
    # - python-multipart: parse application/x-www-form-urlencoded at /oauth/*
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "cachetools>=5.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://srgplus.com"
Documentation = "https://github.com/srgplus/srgplus-mcp#readme"
Repository = "https://github.com/srgplus/srgplus-mcp"
Issues = "https://github.com/srgplus/srgplus-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["srg_mcp"]

[tool.hatch.build.targets.wheel.force-include]
# consent.html and the branding assets are non-Python files inside the
# package; listing them here is belt-and-braces — hatch *should* pick them
# up automatically, but force-include guarantees it regardless of default
# file-pattern heuristics. Each entry is also included in the regular
# package layout, so the wheel ships exactly one copy per file (verified
# via `python -m zipfile -l dist/*.whl`).
"srg_mcp/serve/oauth/consent.html" = "srg_mcp/serve/oauth/consent.html"
"srg_mcp/serve/static/icon.png" = "srg_mcp/serve/static/icon.png"
"srg_mcp/serve/static/icon-32.png" = "srg_mcp/serve/static/icon-32.png"
"srg_mcp/serve/static/icon-192.png" = "srg_mcp/serve/static/icon-192.png"
"srg_mcp/serve/static/icon-512.png" = "srg_mcp/serve/static/icon-512.png"
"srg_mcp/serve/static/favicon.ico" = "srg_mcp/serve/static/favicon.ico"

[project.scripts]
srgplus-mcp = "srg_mcp.server:main"
srgplus-mcp-serve = "srg_mcp.serve.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
