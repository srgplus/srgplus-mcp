<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png">
  <title>Connect to SRG+</title>
  <style>
    :root {
      --bg: #0b0d10;
      --card: #15181d;
      --text: #f5f7fa;
      --muted: #8b95a3;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --error: #ef4444;
      --border: #262a31;
      --input-bg: #0f1216;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: block;
      object-fit: contain;
    }
    .brand-name {
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    h1 {
      font-size: 22px;
      margin: 16px 0 8px;
    }
    p {
      color: var(--muted);
      margin: 0 0 16px;
    }
    .client {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .client-name {
      color: var(--text);
      font-weight: 500;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 12px 0 6px;
    }
    input[type="password"],
    textarea.api-key-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
      transition: border-color 0.15s;
      box-sizing: border-box;
      resize: vertical;
    }
    input[type="password"]:focus,
    textarea.api-key-input:focus {
      border-color: var(--accent);
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    .help {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .help a {
      color: var(--accent);
      text-decoration: none;
    }
    .help a:hover { text-decoration: underline; }
    .scope {
      margin: 16px 0;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .scope strong { color: var(--text); }
    .key-fields { display: flex; flex-direction: column; gap: 8px; }
    .key-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .key-row input[type="password"] {
      flex: 1;
      margin: 0;
    }
    .btn-remove {
      width: 32px;
      height: 32px;
      min-width: 32px;
      margin: 0;
      padding: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-remove:hover { border-color: var(--error); color: var(--error); background: transparent; }
    .btn-add {
      margin-top: 4px;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      width: 100%;
    }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <div class="brand">
        <img class="brand-mark" src="/static/icon-192.png" alt="SRG+ logo" width="40" height="40">
        <div class="brand-name">SRG+</div>
      </div>
      <h1>Connect to SRG+</h1>
      <p>
        <span class="client-name">{{ client_name }}</span> wants to access your SRG+ workspace.
      </p>

      <div class="scope">
        Granting <strong>full access</strong> to your workspace: hub profiles, channels, content, assets, users, and settings.
      </div>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/oauth/authorize" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="client_id" value="{{ client_id }}">
        <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
        <input type="hidden" name="response_type" value="{{ response_type }}">
        <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
        <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
        <input type="hidden" name="state" value="{{ state }}">
        <input type="hidden" name="scope" value="{{ scope }}">

        <input type="hidden" id="api_key" name="api_key">

        <label>SRG+ API Key</label>
        <div class="key-fields" id="key-fields">
          <div class="key-row">
            <input
              type="password"
              placeholder="srgplus_..."
              autofocus
              spellcheck="false"
              autocomplete="off"
              class="key-input"
            >
          </div>
        </div>
        <button type="button" class="btn-add" id="btn-add">+ Add another workspace</button>

        <button type="submit">Authorize</button>
      </form>

      <div class="help">
        One key per workspace. Don't have a key?
        <a href="https://srgplus.com" target="_blank" rel="noopener noreferrer">
          Get one at SRG+ Settings → API Keys
        </a>
      </div>

      <script>
        const fields = document.getElementById('key-fields');
        const hidden = document.getElementById('api_key');
        const form = hidden.closest('form');

        function makeRow(first) {
          const row = document.createElement('div');
          row.className = 'key-row';

          const inp = document.createElement('input');
          inp.type = 'password';
          inp.placeholder = 'srgplus_...';
          inp.spellcheck = false;
          inp.autocomplete = 'off';
          inp.className = 'key-input';
          row.appendChild(inp);

          if (!first) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-remove';
            btn.textContent = '×';
            btn.title = 'Remove';
            btn.addEventListener('click', () => row.remove());
            row.appendChild(btn);
          }
          return row;
        }

        document.getElementById('btn-add').addEventListener('click', () => {
          fields.appendChild(makeRow(false));
          fields.lastElementChild.querySelector('input').focus();
        });

        form.addEventListener('submit', (e) => {
          const keys = [...document.querySelectorAll('.key-input')]
            .map(i => i.value.trim())
            .filter(Boolean);
          if (!keys.length) {
            e.preventDefault();
            document.querySelectorAll('.key-input')[0].focus();
            return;
          }
          hidden.value = keys.join('\n');
        });
      </script>
    </main>
  </div>
</body>
</html>
